<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>לוח ניהול</title>
<style>
@font-face { font-family: "Karantina"; font-weight: 700; src: url(fonts/karantina-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0590-05FF; }
@font-face { font-family: "Karantina"; font-weight: 700; src: url(fonts/karantina-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: "Varela Round"; src: url(fonts/varela-round-hebrew-400-normal.woff2) format("woff2"); unicode-range: U+0590-05FF; }
@font-face { font-family: "Varela Round"; src: url(fonts/varela-round-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:"Varela Round",system-ui,sans-serif;background:#17112e;color:#f4efff;min-height:100dvh;padding:18px;max-width:720px;margin:0 auto}
h1{font-family:Karantina,sans-serif;font-size:3rem;line-height:1;color:#ffd23f}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
button{font-family:inherit;font-weight:700;font-size:1rem;border:3px solid #1d1636;border-radius:14px;padding:10px 16px;cursor:pointer;background:#ffd23f;color:#1d1636;box-shadow:0 4px 0 #0008}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #0008}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #5fb4ff;outline-offset:2px}
.ghost{background:#fff}
#gate{display:grid;gap:14px;justify-items:center;text-align:center;margin-top:18vh}
#sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#2a1f55;border:2px solid #3a2f66;border-radius:16px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-family:Karantina,sans-serif;font-size:2.2rem;line-height:1}
.kpi span{font-size:.8rem;color:#b4a9d6}
.kpi.hot{background:#ff3d7f;border-color:#ff3d7f}.kpi.hot span{color:#fff}
.kpi.warn{border-color:#ffa928}.kpi.warn b{color:#ffa928}
#rec{background:#ffa92822;border:2px solid #ffa928;border-radius:14px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
#rec a{color:#ffd23f;font-weight:700}
#tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#tabs button{background:#2a1f55;color:#fff;border-color:#3a2f66;box-shadow:none;padding:7px 12px}
#tabs button[aria-pressed=true]{background:#7b5cff;border-color:#7b5cff}
#list{display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2a1f55;border:2px solid #3a2f66;border-radius:16px;padding:12px}
.row.st-wait{border-color:#ffd23f}.row.st-ok{border-color:#3fe0b0}
.main{display:grid;gap:2px}
.code{font-family:Karantina,sans-serif;font-size:2rem;letter-spacing:3px;line-height:1}
.dim{color:#b4a9d6;font-size:.88rem}.small{font-size:.78rem}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ok{background:#3fe0b0}.del{background:transparent;border-color:#3a2f66;box-shadow:none;padding:8px 10px;color:#fff}.no{background:#fff;color:#c81e3c}
.tag{font-size:.82rem;padding:4px 10px;border-radius:99px}.tag.ok{background:#3fe0b033;color:#3fe0b0}.tag.no{background:#ff3d7f33;color:#ff8aa8}
.rc{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}.rc input{width:20px;height:20px;accent-color:#3fe0b0}
.empty{text-align:center;color:#b4a9d6;padding:30px}
.foot{margin-top:16px;color:#b4a9d6;font-size:.85rem;line-height:1.6}
#toast{position:fixed;bottom:20px;left:50%;translate:-50% 20px;background:#fff3d1;color:#1d1636;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;translate:-50% 0}
@media (max-width:520px){#sum{grid-template-columns:1fr 1fr}.row{flex-direction:column;align-items:stretch}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<header><h1>לוח ניהול</h1><button class="ghost" id="out" hidden>יציאה</button></header>
<section id="gate">
  <p>הלוח הזה פתוח רק לבעל האתר.</p>
  <button id="login">כניסה עם גוגל</button>
  <p class="dim" id="who"></p>
</section>
<section id="panel" hidden>
  <div id="sum"></div>
  <div id="rec" hidden></div>
  <div id="tabs"><button data-f="wait">מחכים</button><button data-f="ok">אושרו</button><button data-f="rec">בלי קבלה</button><button data-f="no">נדחו</button><button data-f="all">הכל</button></div>
  <div id="list"></div>
  <p class="foot">איך מאשרים: פותחים את ביט, מוצאים העברה של 14.90 ₪ עם הקוד בהערה, ולוחצים "אשר". הפרימיום נפתח מיד לכל מי שמשחק עם הצ'אט הזה, גם באמצע משחק. אחר כך מוציאים קבלה במורנינג ומסמנים "הוצאתי קבלה".<br><button class="ghost" id="notif" style="margin-top:8px">להפעיל התראה על תשלום חדש</button></p>
</section>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
