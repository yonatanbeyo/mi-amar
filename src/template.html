<style>
/* Layout: a late-night party game show; one giant chat bubble is the stage, names are the buzzers below it */
:root {
  color-scheme: dark;
  --night: #17112e; --night-2: #2a1f55; --bubble: #fff3d1; --bubble-ink: #1d1636;
  --pink: #ff3d7f; --yellow: #ffd23f; --mint: #3fe0b0; --sky: #5fb4ff;
  --text: #f4efff; --dim: #b4a9d6; --line: #3a2f66; --glass: rgba(35,26,70,.72);
  --display: "Karantina", "Varela Round", sans-serif;
  --body: "Varela Round", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.2,1.4,.4,1);
  --out: cubic-bezier(.23,1,.32,1); /* ease-out-quint: entries */
  --inout: cubic-bezier(.645,.045,.355,1); /* on-screen movement */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--night); color: var(--text); font-family: var(--body); font-size: 17px; line-height: 1.55; direction: rtl; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
p, .ctx, .note { text-wrap: pretty; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 10px; }
h1, h2, .display { font-family: var(--display); font-weight: 700; line-height: .92; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: clamp(4.2rem, 20vw, 8rem); }
h1 .q { color: var(--yellow); display: inline-block; transform: rotate(-8deg); }
h2 { font-size: clamp(2.3rem, 9vw, 3.4rem); }
p { margin: 0; }
.dim { color: var(--dim); }
.small { font-size: .9rem; }

/* chat bubble stage */
.bubble { position: relative; background: var(--bubble); color: var(--bubble-ink); border-radius: 28px 28px 6px 28px; padding: 22px 24px; box-shadow: 0 10px 0 rgba(0,0,0,.25); font-size: clamp(1.35rem, 5.4vw, 2rem); line-height: 1.35; overflow-wrap: anywhere; transform-origin: 0% 100%; }
.bubble::after { content: ""; position: absolute; left: -10px; bottom: 0; width: 22px; height: 22px; background: var(--bubble); clip-path: polygon(100% 0, 0 100%, 100% 100%); }
.bubble .meta { display: block; font-size: .95rem; color: #6b5f8f; margin-top: 10px; font-family: var(--body); }
.bubble.small-b { font-size: 1.15rem; padding: 14px 18px; }
.bubble.pop { animation: pop .34s var(--out) both; }
@keyframes pop { from { transform: scale(.92) translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.typing { display: inline-flex; gap: 7px; padding: 6px 2px; }
.typing i { width: 12px; height: 12px; border-radius: 50%; background: #8b7fb3; animation: dot 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-7px); opacity: 1; } }
.ai-tag { display: inline-block; font-size: .8rem; background: var(--sky); color: var(--bubble-ink); border-radius: 99px; padding: 2px 10px; margin-bottom: 8px; font-family: var(--body); }

/* buttons: feedback on press, instantly */
.btn { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 16px; padding: 14px 22px; background: var(--pink); color: #fff; box-shadow: 0 5px 0 #b3184f; font-size: 1.1rem; transition: transform 90ms ease-out, box-shadow 90ms ease-out; touch-action: manipulation; }
.btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 2px 0 #b3184f; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.alt { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--line); }
.btn.alt:active { transform: scale(.97); }
.btn.big { font-size: 1.35rem; padding: 18px 26px; }
.icon-btn { font: inherit; background: transparent; border: 2px solid var(--line); color: var(--text); border-radius: 12px; width: 44px; height: 44px; cursor: pointer; font-size: 1.2rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--glass); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.drop { border: 2px dashed var(--line); text-align: center; cursor: pointer; font: inherit; color: var(--text); }
.drop strong { font-family: var(--display); font-size: 2.4rem; display: block; line-height: 1; }
.err { color: var(--pink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; border: 2px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 9px 16px; min-height: 44px; cursor: pointer; transition: transform 100ms ease-out, background-color 150ms ease, border-color 150ms ease; touch-action: manipulation; }
.chip:active { transform: scale(.94); }
.chip.on, .chip[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: var(--bubble-ink); font-weight: 700; }
input[type=text] { font: inherit; background: transparent; color: var(--text); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 0; flex: 1; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.seg button { font: inherit; background: transparent; color: var(--text); border: 0; padding: 8px 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--yellow); color: var(--bubble-ink); font-weight: 700; }

/* game */
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.counter { font-family: var(--display); font-size: 2rem; color: var(--yellow); font-variant-numeric: tabular-nums; }
.timer { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--yellow); transform-origin: right; }
.timer.hurry i { background: var(--pink); }
.kind { font-family: var(--display); font-size: clamp(2.4rem, 10vw, 3.6rem); line-height: 1; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.x2 { font-size: 1rem; font-family: var(--body); background: var(--pink); color: #fff; border-radius: 99px; padding: 3px 12px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { font: inherit; font-weight: 700; font-size: clamp(1.1rem, 4.6vw, 1.5rem); border: 0; border-radius: 18px; padding: 16px 12px; cursor: pointer; color: var(--bubble-ink); min-height: 76px; overflow-wrap: anywhere; transition: transform .25s var(--out), opacity .2s ease, filter .2s ease; touch-action: manipulation; animation: rise .3s var(--out) both; }
.opt.long { font-size: clamp(.95rem, 3.8vw, 1.15rem); font-weight: 500; line-height: 1.35; }
.opt:active { transform: scale(.95); }
.opt:nth-child(1) { background: var(--pink); color: #fff; animation-delay: .03s; }
.opt:nth-child(2) { background: var(--sky); animation-delay: .07s; }
.opt:nth-child(3) { background: var(--yellow); animation-delay: .11s; }
.opt:nth-child(4) { background: var(--mint); animation-delay: .15s; }
@keyframes rise { from { transform: translateY(10px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.opts.revealed .opt { opacity: .22; filter: grayscale(.7); animation: none; transform: translateY(10px) scale(.94); }
.opts.revealed .opt.win { opacity: 1; filter: none; transform: scale(1.07) rotate(-1.5deg); box-shadow: 0 0 0 4px var(--text); }
.context { display: grid; gap: 8px; }
.ctx { font-size: .95rem; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); overflow-wrap: anywhere; }
.ctx b { color: var(--yellow); }
.stamp { font-family: var(--display); font-size: clamp(2.8rem, 13vw, 4.6rem); color: var(--yellow); text-align: center; line-height: 1; animation: stamp .5s var(--spring) both; }
.stamp small { display: block; font-family: var(--body); font-size: 1rem; color: var(--dim); margin-top: 6px; }
@keyframes stamp { from { transform: scale(2.4) rotate(-14deg); opacity: 0; } to { transform: scale(1) rotate(-3deg); opacity: 1; } }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.streak { font-size: .8rem; margin-inline-start: 4px; }

/* overlay: countdown & round cards */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(15,10,35,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-align: center; padding: 24px; }
.big-num { font-family: var(--display); font-size: clamp(9rem, 50vw, 16rem); line-height: 1; color: var(--yellow); animation: count .8s var(--spring) both; }
@keyframes count { from { transform: scale(2.6); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); } }

/* scoreboard */
.board { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 2.2rem minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; animation: rise .3s var(--out) both; }
.brow .fill { position: absolute; inset: 0 0 0 auto; background: rgba(255,210,63,.16); z-index: 0; transform-origin: right; animation: grow .9s var(--spring) both .2s; }
.brow > span { position: relative; z-index: 1; }
@keyframes grow { from { transform: scaleX(0); } }
.brow .pos { font-family: var(--display); font-size: 1.8rem; line-height: 1; }
.brow .pts { font-variant-numeric: tabular-nums; font-weight: 700; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; align-items: end; text-align: center; padding-top: 48px; }
.step { border-radius: 16px 16px 6px 6px; padding: 10px 6px; display: grid; gap: 4px; align-content: start; animation: up .8s var(--spring) both; transform-origin: bottom; min-width: 0; }
.step b { font-family: var(--display); font-size: clamp(1.6rem, 7vw, 2.4rem); line-height: 1; overflow-wrap: anywhere; }
.step .medal { font-size: 2rem; }
.step.p1 { background: var(--yellow); color: var(--bubble-ink); min-height: 190px; animation-delay: .5s; }
.step.p2 { background: var(--sky); color: var(--bubble-ink); min-height: 150px; animation-delay: .25s; }
.step.p3 { background: var(--pink); color: #fff; min-height: 120px; }
@keyframes up { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.award { padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.04); min-width: 0; }
.award b { display: block; font-family: var(--display); font-size: 1.9rem; line-height: 1; color: var(--mint); overflow-wrap: anywhere; }
.toggles { display: grid; gap: 8px; }
.tog { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; cursor: pointer; }
.tog input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--mint); }
.note { font-size: .85rem; color: var(--dim); }

/* hover only where a real pointer exists (touch would get sticky hovers) */
@media (hover: hover) and (pointer: fine) {
  .btn:hover { filter: brightness(1.07); }
  .btn.alt:hover, .chip:hover { background-color: rgba(255,255,255,.06); }
  .opt:hover { filter: brightness(1.08); }
  .opts.revealed .opt:hover { filter: grayscale(.7); }
}
/* onboarding: how to export, as real steps */
.guide { display: grid; gap: 12px; }
.os-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.05); justify-self: start; }
.os-tabs button { font: inherit; border: 0; background: transparent; color: var(--dim); padding: 8px 16px; min-height: 40px; border-radius: 10px; cursor: pointer; transition: background-color 150ms ease, color 150ms ease; }
.os-tabs button[aria-selected="true"] { background: var(--text); color: var(--bubble-ink); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--line); color: var(--yellow); font-family: var(--display); font-size: 1.4rem; line-height: 1; }
.steps b { color: var(--text); }
/* loading: a chat that is typing, plus a checklist of what is happening */
.loading { display: grid; gap: 18px; justify-items: stretch; padding-top: 6vh; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checklist li { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: center; color: var(--dim); transition: color 200ms ease; }
.checklist li .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; transition: background-color 200ms ease, border-color 200ms ease; }
.checklist li.now { color: var(--text); }
.checklist li.now .dot { border-color: var(--yellow); border-top-color: transparent; animation: spin .8s linear infinite; }
.checklist li.done { color: var(--text); }
.checklist li.done .dot { background: var(--mint); border-color: var(--mint); color: var(--bubble-ink); }
@keyframes spin { to { transform: rotate(360deg); } }
/* intro card for a question type seen for the first time */
.intro { display: grid; gap: 10px; justify-items: center; max-width: 520px; }
.intro .tag { font-size: .9rem; color: var(--bubble-ink); background: var(--yellow); border-radius: 999px; padding: 4px 14px; font-weight: 700; }
.intro h3 { font-family: var(--display); font-size: clamp(3rem, 15vw, 5.4rem); line-height: .9; margin: 0; color: var(--text); text-wrap: balance; }
.intro p { color: var(--dim); font-size: 1.1rem; }
.intro .tap { font-size: .85rem; color: var(--dim); opacity: .7; }
/* armed destructive button (second tap confirms) */
.btn.armed { background: var(--pink); color: #fff; box-shadow: 0 5px 0 #b3184f; }
.kbd-hint { font-size: .85rem; color: var(--dim); }
.kbd-hint kbd { font: inherit; font-size: .8rem; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; margin: 0 2px; color: var(--text); }
/* share card preview */
.story { display: grid; gap: 12px; justify-items: center; }
.story img { width: min(260px, 70vw); aspect-ratio: 9 / 16; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 20px 40px -10px rgba(0,0,0,.6); max-width: 100%; }
/* big screens (a TV or laptop in the middle of the room): scale the stage up */
@media (min-width: 1100px) {
  .wrap { max-width: 1040px; }
  .bubble { font-size: 2.6rem; padding: 30px 34px; }
  .opt { font-size: 1.9rem; min-height: 112px; }
  .opt.long { font-size: 1.4rem; }
  .kind { font-size: 4.4rem; }
  .stamp { font-size: 5.6rem; }
}
/* live scoreboard strip: the destination for flying points */
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.strip::-webkit-scrollbar { display: none; }
.sp { flex: 0 0 auto; display: flex; gap: 6px; align-items: baseline; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: .9rem; }
.sp b { font-variant-numeric: tabular-nums; color: var(--yellow); }
.sp.lead { border-color: var(--yellow); }
.fly { position: fixed; z-index: 40; pointer-events: none; font-family: var(--display); font-size: 2.2rem; line-height: 1; color: var(--yellow); text-shadow: 0 3px 0 rgba(0,0,0,.35); will-change: transform, opacity; }
.ring { position: fixed; z-index: 35; pointer-events: none; border-radius: 50%; border: 6px solid var(--yellow); will-change: transform, opacity; }
.flash { position: fixed; inset: 0; z-index: 34; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(255,243,209,.55), transparent 60%); }
.banner { font-family: var(--display); font-size: clamp(3.4rem, 15vw, 6rem); line-height: .95; color: var(--yellow); text-wrap: balance; }
.banner small { display: block; font-family: var(--body); font-size: 1.1rem; color: var(--text); margin-top: 10px; }
body.hurry::before { content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none; box-shadow: inset 0 0 90px rgba(255,61,127,.55); animation: hurry .5s ease-in-out infinite alternate; }
@keyframes hurry { from { opacity: .35; } to { opacity: 1; } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
.crown { display: block; font-size: 3.6rem; line-height: 1; margin: -46px 0 -4px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.3)); }
/* ---------- WOW layer ---------- */
/* each question type has its own accent; the whole room (aurora, timer, title) shifts to it */
body { --accent: var(--yellow); --a1: #ff3d7f; --a2: #5fb4ff; --a3: #3fe0b0; }
body[data-kind="quote"]  { --accent: var(--yellow); --a1: #ff3d7f; --a2: #ffb13f; --a3: #5fb4ff; }
body[data-kind="finish"] { --accent: var(--sky);    --a1: #3f7bff; --a2: #5fe0ff; --a3: #b18cff; }
body[data-kind="reply"]  { --accent: var(--mint);   --a1: #19c39a; --a2: #5fb4ff; --a3: #ffd23f; }
body[data-kind="phrase"] { --accent: var(--pink);   --a1: #ff3d7f; --a2: #ff7ad9; --a3: #ffd23f; }
body[data-kind="stat"]   { --accent: #ff9f43;       --a1: #ff6b3d; --a2: #ffd23f; --a3: #ff3d7f; }
body[data-kind="number"] { --accent: var(--yellow); --a1: #ffd23f; --a2: #3fe0b0; --a3: #ff3d7f; }
body[data-kind="moment"] { --accent: #ff3d7f; --a1: #ff3d7f; --a2: #ffd23f; --a3: #ff9f43; }
body[data-kind="word"]   { --accent: #ff7ad9;       --a1: #ff3d7f; --a2: #b18cff; --a3: #ffd23f; }
body[data-kind="when"]   { --accent: var(--sky);    --a1: #1d2b6b; --a2: #5fb4ff; --a3: #b18cff; }
body[data-kind="ai"]     { --accent: #b18cff;       --a1: #7b3dff; --a2: #ff3d7f; --a3: #3fd0ff; }
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .34; transition: background-color .9s ease; will-change: transform; }

  function setup() {
    let everyone = [], quiet = [];
    try {
      const PP = parsedFor(S.chatText), all = PP.msgs;
      everyone = PP.stats.people.filter((p) => p.messages >= 3).slice(0, 14).map((p) => p.name);
      // WhatsApp exports sometimes miss the "X left" line. Someone who was only around briefly and has been silent
      // for a long time is most likely not in the group anymore: start them unticked (the host can tick them back)
      // one pass: first/last message and count per person
      let end = 0; const span = {}; for (const m of all) { if (!m.ts) continue; if (m.ts > end) end = m.ts; const s = (span[m.author] ||= { f: m.ts, l: m.ts, c: 0 }); s.c++; if (m.ts < s.f) s.f = m.ts; if (m.ts > s.l) s.l = m.ts; }
      const DAY = 864e5;

    } catch {}

    S.rounds = S.rounds || store.get("rounds", 10);
    S.kinds = S.kinds || { quote: true, finish: true, reply: true, phrase: true, word: true, when: true, stat: true, number: true, ai: true, ...store.get("kinds", {}) };

  // the wait while Claude reads: a chat bubble "typing", and a checklist of what is happening
  function loadingScreen() {
    const steps = [["read", "קורא את הצ'אט"], ["pick", "Claude בוחר את ההודעות הכי מצחיקות"], ["fake", "Claude מתאמן לכתוב כמוכם"], ["mix", "מערבב את השאלות"]]
      .filter(([k]) => (k !== "pick" || (sampleFn && S.kinds.quote)) && (k !== "fake" || (sampleFn && S.kinds.ai)));
    app.innerHTML = `<section class="loading" aria-live="polite">
      <h2>מכין את המשחק</h2>
      <div class="bubble"><span class="typing" aria-label="מקליד"><i></i><i></i><i></i></span></div>
      <ul class="checklist" id="check">${steps.map(([k, t]) => `<li data-k="${k}"><span class="dot"></span><span>${t}</span></li>`).join("")}</ul>
      <button class="btn alt" id="skip-ai" hidden>להתחיל עכשיו, בלי Claude</button>
      <p class="note" id="skip-note" hidden>Claude לוקח זמן היום. אפשר להתחיל בלעדיו, עם הודעות שהמשחק בוחר לבד.</p>
    </section>`;
    enter();
    S._skip = null;
    const skipP = new Promise((r) => (S._skip = r));
    later(() => { const b = document.getElementById("skip-ai"); if (!b) return; b.hidden = false; document.getElementById("skip-note").hidden = false; anim(b, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: EASE.out }); b.onclick = () => { SFX.tap(); S._skip && S._skip("skip"); }; }, 7000);
    let cur = null;
    const fn = (k) => {
      const ul = document.getElementById("check"); if (!ul) return;
      const items = [...ul.children], idx = items.findIndex((li) => li.dataset.k === k);
      items.forEach((li, i) => { li.classList.toggle("done", i < idx); li.classList.toggle("now", i === idx); if (i < idx) li.querySelector(".dot").textContent = "✓"; });
      if (cur !== k && idx > 0) SFX.point();
      cur = k;
    };
    fn.skip = skipP;
    return fn;
  }

    overlay.innerHTML = `<div class="big-num" style="font-size:clamp(5rem,26vw,9rem)">יאללה!</div>`; SFX.go(); buzz([30, 40, 30]);

  }

  // ----- the question screen, shared by the main screen and every phone (phones mirror it exactly) -----
  function bubbleInner(q, revealed) {
    const body = q.type === "reply"
      ? `<div class="ctx" style="margin-bottom:10px;font-size:1rem"><b>${esc(q.by)}:</b> ${esc(q.text)}</div>${revealed ? esc(q.replyText) : "<span class='dim' style='font-size:1rem;color:#6b5f8f'>מי ענה על זה, ומה?</span>"}`
      : q.type === "finish" ? esc(revealed ? q.full : q.text)
      : esc(q.text);

  const pend = (p) => ((S.idx + 1 >= S.game.questions.length ? 200 : 100) + ((S.streaks[p] || 0) >= 2 ? 50 : 0) + (S.multi ? (S.bonus?.[p] || 0) : 0)) * (S.multi && S.answers?.[p]?.b ? 2 : 1);

  // ---------- the winners show (runs on the big screen and on every phone) ----------

  async function podiumShow(rows) {

    document.body.append(box);
    let skip = false; box.onclick = () => { skip = true; };
    const wait = (ms) => new Promise((r) => { const t0 = Date.now(), iv = setInterval(() => { if (skip || Date.now() - t0 >= ms) { clearInterval(iv); r(); } }, 30); });
    const title = box.querySelector("#sh-t"), stage = box.querySelector("#sh-s");

    const say = (txt) => {

      stage.append(col); cols[p.place] = col;
    }
    const tickCount = (el, to, ms) => { const t0 = performance.now(); let last = -1; const step = (now) => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3), v = Math.round(to * e); el.textContent = n(v); const s = Math.floor(e * 18); if (s !== last && k < 1) { last = s; tone(900 + s * 40, .025, "square", .03); } if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
    await wait(400);

      if (!skip) {
        say(win ? (places.length > 1 ? "ובמקום הראשון" : "והמנצח של הערב") : p.place === 2 ? "במקום השני" : "במקום השלישי");

        await wait(win ? 3200 : 1600);

        [[.18, .28], [.82, .24], [.5, .14], [.3, .4], [.7, .38], [.5, .3]].forEach(([x, y], i) => later(() => { if (!skip) firework(innerWidth * x, innerHeight * y, ["#ffbe2e", "#ff5fa2", "#19c4a0", "#7b5cff", "#5fb4ff", "#ffbe2e"][i]); }, 500 + i * 420));

      const r = myRank(d);
      anim(card, [{ transform: "scale(.6) rotate(-6deg)", opacity: 0 }, { transform: "scale(1.06) rotate(1deg)", opacity: 1, offset: .6 }, { transform: "none", opacity: 1 }], { duration: 620, easing: EASE.out });
      if (r && r.pos === 1 && r.pts > 0) { SFX.win(); buzz([60, 40, 60, 40, 120]); [[.3, .3], [.7, .25], [.5, .4]].forEach(([x, y], i) => later(() => confetti(90, innerWidth * x, innerHeight * y, .8), 200 + i * 260)); }
      else SFX.reveal();
      return;
    }
    const r = (d.res || {})[S.rname];
    anim(card, [{ transform: "scale(2) rotate(-10deg)", opacity: 0 }, { transform: "scale(.95) rotate(-1deg)", opacity: 1, offset: .6 }, { transform: "none", opacity: 1 }], { duration: 520, easing: EASE.out });
    if (r && r[0]) { later(() => { SFX.reveal(); SFX.coin(2); buzz([40, 30, 80]); flash(); confetti(130); }, 180); }
    else { later(() => { SFX.wrong(); later(SFX.sad, 380); buzz([80, 60, 120]); shake(card, 10); }, 200); }
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (!overlay.hidden) return;
    const click = (id) => { const el = document.getElementById(id); if (el && !el.disabled && !el.hidden) { el.click(); return true; } return false; };
    const k = e.key;
    if (k === " " || k === "Enter") { if (click("reveal") || click("next") || click("cont")) e.preventDefault(); }
    else if (/^[1-4]$/.test(k)) { const o = app.querySelectorAll(".opt")[+k - 1]; if (o && document.getElementById("reveal")) { e.preventDefault(); o.click(); } }
    else if (k === "m" || k === "M" || k === "צ") click("mute");
    else if ((k === "f" || k === "F" || k === "כ") && canFull) toggleFull();
  });

  // a refresh (or the phone locking) must not kill the game: keep this tab's state, minus the raw chat
  let snapT = null;
  function snapshot() {
    clearTimeout(snapT);
    snapT = setTimeout(() => { try { const { chatText, _skip, ...rest } = S; sessionStorage.setItem("miamar", JSON.stringify(rest)); } catch {} }, 150);
  }
  function start() {
    let saved = null; try { saved = JSON.parse(sessionStorage.getItem("miamar") || "null"); } catch {}
    const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
    if (saved && saved.screen === "remote" && saved.rc && (!code || code === saved.rc)) {
      S = { screen: "home" }; render();
      joinGame(saved.rc, saved.rname).then((ok) => { if (!ok) { S = { screen: "home", err: "המשחק הזה כבר נסגר." }; render(); } });
      return;
    }
    if (saved && saved.multi && saved.code && ["lobby", "play", "mid", "end"].includes(saved.screen)) {
      S = saved; S.revealing = false; S.asking = false;
      if (S.screen === "play" && !S.revealed) S.answers = {};
      render(); resumeHost(); return;
    }
    if (saved && saved.game && ["play", "mid", "end"].includes(saved.screen)) { S = saved; S.revealing = false; render(); return; }
    render();
  }
  start();

  // where visitors come from: one count per visit (tab session), anonymous. No names, no IPs, nothing from the chat.
  (() => {
    try { if (sessionStorage.getItem("miamar_seen")) return; sessionStorage.setItem("miamar_seen", "1"); } catch { return; }
    const q = new URLSearchParams(location.search), ua = navigator.userAgent || "", ref = document.referrer || "";
    const tag = (q.get("ref") || q.get("utm_source") || "").toLowerCase().replace(/[^a-z]/g, "").slice(0, 12);
    const src = tag ? tag
      : /Instagram/i.test(ua) ? "instagram"
      : /musical_ly|TikTok|Bytedance/i.test(ua) ? "tiktok"
      : /FBAN|FBAV|FB_IAB/i.test(ua) ? "facebook"
      : q.get("c") ? "qr"
      : /google\./i.test(ref) ? "google"
      : /(t\.co|twitter|x\.com)/i.test(ref) ? "x"
      : /whatsapp/i.test(ref) ? "whatsapp"
      : ref && !ref.includes(location.host) ? "other" : "direct";
    const dev = OS === "ios" ? "ios" : OS === "android" ? "android" : "desktop";
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "");
    const geo = /Jerusalem|Tel_Aviv|Hebron|Gaza/.test(tz) ? "il" : /^America\//.test(tz) ? "am" : /^Europe\//.test(tz) ? "eu" : tz ? "other" : "unknown";
    ["visit", "src_" + src, "dev_" + dev, "geo_" + geo].forEach((k) => NET.bump(k));
  })();
})();
</script>
</body>
